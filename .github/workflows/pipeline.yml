name: pipeline

# Pipeline unica del repo. Cosa succede lo decide il ref, non il nome del file:
# il livello lo calcola plan.yml e tutti gli altri job leggono i suoi output.
#
#   pull_request / push su un branch -> check     controlli base + segreti
#   push su main/mensa               -> dev       base + immagini :dev
#   tag bX.Y.Z                       -> staging   base + immagini :staging
#   tag vX.Y.Z                       -> release   base + scansioni complete + Release firmata
#   cron del lunedi                  -> audit     solo scansioni complete
#
# Questo repo e' un fork di HiEventsDev/Hi.Events e il branch di prodotto e'
# main/mensa, non main. develop resta agganciato perche' e' il branch su cui
# arrivano gli allineamenti da upstream ed e' uno dei trigger di
# unit-tests.yml, il workflow che questa pipeline sostituisce: e' pero' un
# trigger di soli controlli, non pubblica niente.

on:
  # Nessun filtro sul branch di destinazione, ed e' voluto: unit-tests.yml
  # girava su `pull_request:` senza filtro, quindi anche sulle PR verso i
  # branch feature/* che stanno su origin. Restringere a [main/mensa, develop]
  # avrebbe tolto phpunit alle PR fra branch di lavoro, che e' esattamente
  # quando serve.
  pull_request:
  push:
    # Sui branch di lavoro il push non serve: la PR copre gli stessi commit e
    # con lo stesso livello. unit-tests.yml si comportava allo stesso modo.
    branches: [main/mensa, develop]
    tags: ['v*', 'b*']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        options: [check, dev, staging, release, audit]
        default: check

concurrency:
  group: pipeline-${{ github.ref }}
  # I tag non si annullano mai fra loro. Una release a meta' e' peggio di due
  # release in coda.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  plan:
    uses: Mensa-Italia/.github/.github/workflows/plan.yml@main
    with:
      # Nessun 'image': plan.yml calcola i tag di UNA immagine e qui sono tre.
      # Li costruisce il job 'tags' a partire da tier e version.
      #
      # plan.yml riconosce il livello 'dev' su refs/heads/main. Il branch di
      # prodotto di questo fork e' main/mensa, quindi glielo imponiamo noi:
      # senza questo, un push su main/mensa resterebbe a 'check' e non
      # pubblicherebbe le immagini :dev.
      forced-tier: ${{ inputs.tier || (github.event_name == 'push' && github.ref == 'refs/heads/main/mensa' && 'dev') || '' }}

  # I controlli base sono due job perche' il repo e' due progetti: Laravel in
  # backend/, React+Vite in frontend/.
  check-backend:
    name: backend (php ${{ matrix.php-versions }})
    needs: plan
    if: needs.plan.outputs.tier != 'audit'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4']

    services:
      # Serve alle Feature: usano RefreshDatabase e la prima migrazione carica
      # database/migrations/extensions.sql (pg_trgm) e schema.sql.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U username -d backend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          # L'elenco e' quello di unit-tests.yml. pdo_pgsql e pgsql sono
          # l'unica aggiunta: senza, le Feature non hanno un driver.
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_pgsql, pgsql, tokenizer
          ini-values: post_max_size=256M, upload_max_filesize=256M
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        # Era `::set-output`, che i runner non accettano piu'.
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Create Laravel bootstrap cache directory
        run: mkdir -p ./backend/bootstrap/cache && chmod -R 777 ./backend/bootstrap/cache

      - name: Install dependencies
        run: cd backend && composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit Tests
        run: cd backend && ./vendor/bin/phpunit tests/Unit --no-coverage

      # Le Feature esistono da sempre in tests/Feature e non le eseguiva
      # nessuno: unit-tests.yml si fermava a tests/Unit.
      - name: Prepare Laravel environment for Feature tests
        run: cd backend && cp .env.example .env

      - name: Run PHPUnit Feature Tests
        env:
          # Variabili d'ambiente vere: il repository di phpdotenv usato da
          # Laravel e' immutable, quindi vincono su quelle di .env.
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: backend
          DB_USERNAME: username
          DB_PASSWORD: password
        run: cd backend && ./vendor/bin/phpunit tests/Feature --no-coverage

  check-frontend:
    name: frontend
    needs: plan
    if: needs.plan.outputs.tier != 'audit'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Lo script c'e' in package.json dal primo giorno e non lo invocava
      # nessun workflow.
      - name: ESLint
        run: yarn lint

  # La scansione segreti gira a OGNI livello, non solo a release: un segreto
  # committato va intercettato prima del merge. Costa pochi secondi ed e'
  # l'unica parte di scan.yml che ha senso su una PR, quindi qui si chiama
  # scan.yml con dipendenze e SBOM spenti e a release lo si richiama con
  # l'inverso, cosi' gitleaks non gira due volte nella stessa esecuzione.
  #
  # La storia di questo repo comincia da upstream e contiene tredici segnalazioni
  # di gitleaks anteriori al fork: sono nell'allowlist di .gitleaks.toml, che
  # scan.yml raccoglie da solo. Senza quel file questo job e' rosso sempre.
  secrets-scan:
    needs: plan
    permissions:
      contents: read
    uses: Mensa-Italia/.github/.github/workflows/scan.yml@main
    with:
      secrets-scan: true
      deps-scan: false
      sbom: false

  # Le scansioni pesanti: vulnerabilita' note delle dipendenze e SBOM. Solo
  # release e audit.
  #
  # Solo contents: read. security-events: write serviva quando scan.yml
  # delegava a google/osv-scanner-action, che caricava un SARIF; ora usa il
  # binario e non carica niente, quindi il permesso in piu' sarebbe soltanto
  # un permesso in piu'.
  deep:
    needs: plan
    if: needs.plan.outputs.deep == 'true'
    permissions:
      contents: read
    uses: Mensa-Italia/.github/.github/workflows/scan.yml@main
    with:
      secrets-scan: false
      deps-scan: true
      sbom: true

  # plan.yml calcola i tag per una sola immagine, questo repo ne pubblica tre.
  # Le regole per livello sono le stesse di plan.yml, applicate ai tre nomi:
  # se plan.yml cambia le sue, questo blocco va riallineato a mano.
  tags:
    name: tag immagini
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      backend: ${{ steps.t.outputs.backend }}
      frontend_ssr: ${{ steps.t.outputs.frontend_ssr }}
      frontend_csr: ${{ steps.t.outputs.frontend_csr }}
    steps:
      - id: t
        env:
          TIER: ${{ needs.plan.outputs.tier }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short="${SHA:0:7}"
          summary=""

          # staging e release prendono la versione dal tag. plan.yml ora si
          # ferma se qualcuno forza quei livelli da workflow_dispatch stando su
          # un branch, ma il controllo lo rifacciamo qui: un tag ':' vuoto
          # pubblicato per errore non si ritira.
          case "$TIER" in
            staging|release)
              if [ -z "$VERSION" ]; then
                echo "::error::Livello '$TIER' senza versione: serve un tag (vX.Y.Z o bX.Y.Z), non un livello forzato da un branch."
                exit 1
              fi ;;
          esac

          emit() {
            out="$1"; comp="$2"
            reg="ghcr.io/mensa-italia/mensa-events/${comp}"
            case "$TIER" in
              dev)
                tags="${reg}:dev"$'\n'"${reg}:sha-${short}" ;;
              staging)
                tags="${reg}:staging"$'\n'"${reg}:${VERSION}"$'\n'"${reg}:sha-${short}" ;;
              release)
                tags="${reg}:${VERSION}"$'\n'"${reg}:sha-${short}"
                # Stessa regola di plan.yml: una prerelease (v1.3.0-rc1) non e'
                # l'ultima stabile, quindi niente :latest e niente :X.Y. Chi
                # punta a quei due tag vuole la stabile, non l'ultima caricata.
                case "$VERSION" in
                  *-*) : ;;
                  *)   tags="${reg}:latest"$'\n'"$tags"$'\n'"${reg}:${VERSION%.*}" ;;
                esac ;;
              *)
                echo "::error::Livello '$TIER' non pubblica immagini: il job 'tags' non doveva partire."
                exit 1 ;;
            esac
            {
              echo "${out}<<__EOT__"
              printf '%s\n' "$tags"
              echo "__EOT__"
            } >> "$GITHUB_OUTPUT"
            summary="${summary}${tags}"$'\n'
          }

          emit backend      backend
          emit frontend_ssr frontend-ssr
          emit frontend_csr frontend-csr

          case "$TIER:$VERSION" in
            release:*-*) echo "::notice::Prerelease $VERSION: niente :latest ne' :${VERSION%.*}." ;;
          esac

          {
            echo "### Tag immagine (livello \`$TIER\`)"
            echo ""
            echo '```'
            printf '%s' "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Niente esce prima dei controlli.
  #
  # I job immagine sono sdoppiati per livello invece di essere uno solo con una
  # condizione furba. Un job che ha fra i needs qualcosa di 'skipped' viene
  # saltato a sua volta, a meno di scriverci sopra un if con !cancelled(); ma
  # quell'if disattiva il success() implicito, e da quel momento ogni singolo
  # needs va riverificato a mano con needs.X.result. Basta dimenticarne uno e
  # si pubblica con i test rossi. Sdoppiando, l'elenco dei needs E' il
  # cancelletto: dev/staging aspettano i controlli base e i segreti, release
  # aspetta anche deep.

  image-backend:
    name: immagine backend (dev/staging)
    needs: [plan, check-backend, check-frontend, secrets-scan, tags]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.tier != 'release'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-events/backend
      tags: ${{ needs.tags.outputs.backend }}
      context: ./backend
      file: ./backend/Dockerfile
      license: AGPL-3.0-only

  image-frontend-ssr:
    name: immagine frontend-ssr (dev/staging)
    needs: [plan, check-backend, check-frontend, secrets-scan, tags]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.tier != 'release'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-events/frontend-ssr
      tags: ${{ needs.tags.outputs.frontend_ssr }}
      context: ./frontend
      file: ./frontend/Dockerfile.ssr
      license: AGPL-3.0-only

  image-frontend-csr:
    name: immagine frontend-csr (dev/staging)
    needs: [plan, check-backend, check-frontend, secrets-scan, tags]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.tier != 'release'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-events/frontend-csr
      tags: ${{ needs.tags.outputs.frontend_csr }}
      context: ./frontend
      file: ./frontend/Dockerfile.csr
      license: AGPL-3.0-only

  # Le stesse tre immagini al livello release. L'unica differenza e' 'deep' fra
  # i needs: qui le scansioni pesanti sono gia' passate, altrimenti questi job
  # non partono e senza di loro non parte 'publish'.
  image-backend-release:
    name: immagine backend (release)
    needs: [plan, check-backend, check-frontend, secrets-scan, deep, tags]
    if: needs.plan.outputs.tier == 'release'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-events/backend
      tags: ${{ needs.tags.outputs.backend }}
      context: ./backend
      file: ./backend/Dockerfile
      license: AGPL-3.0-only

  image-frontend-ssr-release:
    name: immagine frontend-ssr (release)
    needs: [plan, check-backend, check-frontend, secrets-scan, deep, tags]
    if: needs.plan.outputs.tier == 'release'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-events/frontend-ssr
      tags: ${{ needs.tags.outputs.frontend_ssr }}
      context: ./frontend
      file: ./frontend/Dockerfile.ssr
      license: AGPL-3.0-only

  image-frontend-csr-release:
    name: immagine frontend-csr (release)
    needs: [plan, check-backend, check-frontend, secrets-scan, deep, tags]
    if: needs.plan.outputs.tier == 'release'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-events/frontend-csr
      tags: ${{ needs.tags.outputs.frontend_csr }}
      context: ./frontend
      file: ./frontend/Dockerfile.csr
      license: AGPL-3.0-only

  # Dockerfile.all-in-one sta ancora alla radice e dalla cancellazione di
  # post-release-push-images.yml non lo costruiva piu' nessuno: si sarebbe
  # rotto in silenzio. Non lo pubblichiamo (upstream lo spingeva su
  # docker.io/daveearley, un account che non e' nostro), quindi push: false, e
  # attest: false perche' provenance e SBOM hanno senso solo su un'immagine che
  # viene davvero caricata.
  #
  # Gira all'audit del lunedi', non a release, e non e' fra i needs di
  # 'publish'. E' voluto: e' un'immagine che non spediamo, costruita da un
  # Dockerfile che nel fork non e' mai stato costruito con successo (i segreti
  # di Docker Hub non esistevano) e che parte da un tag beta di
  # serversideup/php. Se e' rotto va saputo, ma non deve tenere ferma una
  # Release. Un 'uses:' non accetta continue-on-error, quindi l'unico modo di
  # renderlo non bloccante e' tenerlo fuori dalla catena.
  image-all-in-one:
    name: immagine all-in-one (solo build, audit)
    needs: [plan, secrets-scan]
    if: needs.plan.outputs.tier == 'audit'
    permissions:
      contents: read
      packages: write
    uses: Mensa-Italia/.github/.github/workflows/image.yml@main
    with:
      image: mensa-italia/mensa-events/all-in-one
      tags: ghcr.io/mensa-italia/mensa-events/all-in-one:audit
      context: .
      file: ./Dockerfile.all-in-one
      push: false
      attest: false
      license: AGPL-3.0-only

  # La Release esce per ultima, dopo che le tre immagini sono su GHCR.
  # L'if non contiene funzioni di stato, quindi vale il success() implicito:
  # basta che uno dei needs fallisca o venga saltato perche' la Release non
  # esista. 'tags' non e' nell'elenco perche' ci arriva attraverso i tre job
  # immagine, che senza di lui non partono.
  #
  # artifact: sbom allega alla Release l'SBOM prodotto da deep e lo firma con
  # cosign keyless. Senza, id-token: write non firmava niente e la Release era
  # una pagina di note e basta.
  publish:
    needs:
      - plan
      - check-backend
      - check-frontend
      - secrets-scan
      - deep
      - image-backend-release
      - image-frontend-ssr-release
      - image-frontend-csr-release
    if: needs.plan.outputs.tier == 'release'
    uses: Mensa-Italia/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
      id-token: write
    with:
      version: ${{ needs.plan.outputs.version }}
      artifact: sbom
      prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
